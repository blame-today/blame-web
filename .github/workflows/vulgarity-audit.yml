name: vulgarity audit

# Daily sweep (issue #22). The content filter (src/lib/filter.ts) is word-level, so phrase-level
# vulgarity where no single word is profane lands on the board (e.g. "fingering the dog"). This
# pulls the top blame targets by votes, asks gemini which of the currently DISPLAYED ones are
# genuinely vulgar, and turns the flagged strings into literal blocklist entries. The model judges
# WHAT is vulgar; scripts/vulgarity-audit.mjs decides HOW to block it (dumb literals, never
# LLM-authored regexes) and refuses to write if the patch would hide any un-flagged entry
# (the collateral guard). It also runs `npm test` before staging. Only then do we open + merge a
# PR, so the next deploy hides them. workflow_dispatch is the "run now" button.

on:
  schedule:
    - cron: '17 8 * * *' # 08:17 UTC daily (~4am ET), off-peak
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vulgarity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # node 24+ strips TS types, so the audit can import src/lib/filter.ts directly (zero drift
          # from the shipped filter). matches deploy-web.yml's node 24.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run the audit (fetch, judge, patch, guard, test)
        id: audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/vulgarity-audit.mjs

      - name: Open + merge the patch PR
        if: steps.audit.outputs.has_changes == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          BRANCH="vulgarity-audit/$DATE-${{ github.run_id }}"
          git config user.name 'blame-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add src/lib/filter.ts tests/audit.test.ts
          git commit -m "filter: block ${{ steps.audit.outputs.flagged_count }} gemini-flagged vulgar entries (refs #22)"
          git push -u origin "$BRANCH"
          PR=$(gh pr create --base main --head "$BRANCH" \
            --title "vulgarity audit $DATE: block ${{ steps.audit.outputs.flagged_count }} entries" \
            --body "Automated by .github/workflows/vulgarity-audit.yml (issue #22). gemini flagged these off the live board; the collateral guard confirmed 0 over-block over the top-N and npm test is green. merging ships them to the board on the next deploy. revert this PR to undo.")
          # Already validated in-job (guard + tests), so merge straight in. The PR is the record + revert point.
          gh pr merge "$PR" --squash --delete-branch
