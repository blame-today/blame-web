name: Publish to MCP Registry

# server.json is static metadata for the remote MCP server at https://blame.today/mcp (served inline
# by worker/index.js). Re-publish when server.json changes (bump its `version`). Domain ownership is
# proven by the apex TXT on blame.today (managed in infra/ via OpenTofu); this only needs the Ed25519
# signing key, the MCP_DNS_PRIVATE_KEY repo secret.
on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl --fail --location --silent --show-error -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Skip if this version is already published
        id: guard
        run: |
          LOCAL=$(jq -r .version server.json)
          PUBLISHED=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=blame" \
            | jq -r --arg v "$LOCAL" '[.servers[] | select(.server.name=="today.blame/mcp" and .server.version==$v)] | length')
          if [ "$PUBLISHED" != "0" ]; then
            echo "today.blame/mcp version $LOCAL is already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry (DNS)
        if: steps.guard.outputs.skip == 'false'
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain blame.today --private-key "$MCP_DNS_PRIVATE_KEY"

      - name: Validate and publish
        if: steps.guard.outputs.skip == 'false'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher publish
